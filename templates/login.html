{% extends "base.html" %}
{% block title %}Login - NanotechSoft{% endblock %}
{% block body %}
<main class="login-page">
  <section class="login-card" aria-label="Login">
    <div class="brand-mark">
      <div class="brand-logo">NS</div>
      <div>
        <h1>NanotechSoft</h1>
        <p>Portal integrado</p>
      </div>
    </div>

    <form id="loginForm" class="login-form" autocomplete="off">
      <label>
        Usuario
        <input id="loginUsuario" name="login" type="text" autocomplete="off" required>
      </label>
      <label>
        Senha
        <input id="loginSenha" name="senha" type="password" autocomplete="off" required>
      </label>
      <button type="submit">Entrar</button>
      <div id="loginMsg" class="form-msg" role="status"></div>
    </form>

    <div class="login-shortcuts" aria-label="Acessos sem login">
      <a class="action-link" href="https://192.168.200.254:8899/relatorios.html">
        Acessar somente relatorios
      </a>
    </div>
  </section>
</main>
{% endblock %}
