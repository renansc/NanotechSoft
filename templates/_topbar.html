<header class="topo">
  <a class="user-settings-link" href="{{ url_for('config_page') }}#minha-conta" aria-label="Configuracoes do usuario" title="Configuracoes do usuario">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg>
  </a>
  <div class="topo-title">
    <h1>{{ deploy_name or "NanotechSoft" }}</h1>
    <a class="topbar-user-name" href="{{ url_for('config_page') }}#minha-conta" title="Minha conta">{{ usuario.nome }}</a>
  </div>
  <button class="menu-toggle" type="button" data-menu-toggle aria-label="Abrir menu" aria-expanded="false" aria-controls="mainMenu">☰</button>
  {% include "_menu.html" %}
  <a class="topbar-logo" data-topbar-logo data-default-url="https://renansc.github.io/" href="{{ config.logo_url if config.logo_data and config.logo_url else 'https://renansc.github.io/' }}" target="_blank" rel="noopener noreferrer" title="Abrir site em nova aba">
    <img {% if config.logo_data %}src="{{ config.logo_data }}"{% else %}hidden{% endif %} alt="Logo da empresa" data-logo-image>
    <span data-logo-fallback{% if config.logo_data %} hidden{% endif %}>Nanotechsoft</span>
  </a>
  <button class="topbar-logout" type="button" data-logout>Sair</button>
</header>
<div class="menu-overlay" data-menu-overlay></div>
<script type="application/json" id="menuAccessState">{{ menu_access_state|default([])|tojson }}</script>
<script src="{{ url_for('static', filename='menu-access.js') }}"></script>
