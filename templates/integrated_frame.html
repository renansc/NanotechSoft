{% extends "base.html" %}
{% block title %}{{ app_nome }} - NanotechSoft{% endblock %}
{% block body %}
<div class="app-shell">
  {% set topbar_title = app_nome if show_portal is defined and not show_portal else "NanotechSoft" %}
  {% set topbar_subtitle = app_nome %}
  {% include "_topbar.html" %}


  <main class="content riob-integrated-page">
    <iframe
      id="riobIntegratedFrame"
      class="riob-integrated-frame"
      {% if frame_document is defined %}srcdoc="{{ frame_document }}"{% else %}src="{{ frame_url }}"{% endif %}
      title="{{ app_nome }}"
      loading="eager"
      allow="camera; microphone; clipboard-read; clipboard-write; fullscreen"
    ></iframe>
  </main>
</div>
<style>
.app-shell:has(.riob-integrated-page) {
  display: flex;
  flex-direction: column;
  height: 100dvh;
}
.riob-integrated-page {
  flex: 1;
  min-height: 0;
  padding: 0;
  overflow: hidden;
}
.riob-integrated-frame {
  display: block;
  width: 100%;
  height: 100%;
  height: 100%;
  min-height: 0;
  border: 0;
  background: transparent;
}
@media (max-width: 760px) {
  .riob-integrated-frame {
    height: 100%;
    height: 100%;
  }
}
</style>
<script>
(function () {
  var frame = document.getElementById("riobIntegratedFrame");
  if (!frame || frame.hasAttribute("srcdoc")) return;

  function sendHash() {
    var hash = window.location.hash || new URL(frame.src).hash || "";
    try {
      if (frame.contentWindow && frame.contentWindow.location.hash !== hash) {
        frame.contentWindow.location.hash = hash;
      }
    } catch (_) {}
  }

  frame.addEventListener("load", sendHash);
  window.addEventListener("hashchange", sendHash);
})();
</script>
{% endblock %}
