services:
  - type: web
    name: nanotechsoft
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: >-
      gunicorn --bind 0.0.0.0:10000 --workers 1 --threads 16
      --timeout 240 app:app
    autoDeployTrigger: commit
    healthCheckPath: /healthz
    envVars:
      - key: FLASK_SECRET
        generateValue: true
      - key: NS_DB_HOST
        sync: false
      - key: NS_DB_PORT
        sync: false
      - key: NS_DB_USER
        sync: false
      - key: NS_DB_PASSWORD
        sync: false
      - key: NS_DB_NAME
        sync: false
      - key: CLIENTE_DEPLOY_ID
        value: cloud
      - key: NS_DEPLOY_MODE
        value: cloud-readonly
      - key: NS_READ_ONLY
        value: "1"
      - key: NS_CACHE_PROVIDER
        value: alwaysdata
      - key: NS_CACHE_MAX_AGE_SECONDS
        value: "900"
      - key: NS_CACHE_DATABASE_MAP
        sync: false
      - key: NS_CACHE_DEFAULT_CLIENT
        value: rio-branco
      - key: NS_HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: NS_PORT
        value: "10000"
      - key: NS_DEBUG
        value: "0"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_THREADS
        value: "16"
      - key: NS_DB_CONNECT_TIMEOUT
        value: "5"
      - key: GUNICORN_TIMEOUT
        value: "240"
      - key: AUTOMACAO_APP_DIR
        value: /app/apps/automacao/source
      - key: NANOPONTO_APP_DIR
        value: /app/apps/nanoponto/source
      - key: ZAP_APP_DIR
        value: /app/apps/zap/source
      - key: NANOSTORE_APP_DIR
        value: /app/apps/nanostore/source
      - key: RIOB_PROXY_ONLY
        value: "1"
      - key: RIOB_APP_PORT
        value: "8898"
      - key: RIOB_STARTUP_WAIT
        value: "600"
      - key: RIOB_DB_NAME
        value: riobranco
      - key: RB_AGENT_LLM_PROVIDER
        value: "off"
      - key: RIOB_SSL_VERIFY
        value: "0"
