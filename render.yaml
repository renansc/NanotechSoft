services:
  - type: web
    name: nanotechsoft
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: >-
      sh -c 'exec gunicorn --bind 0.0.0.0:${PORT:-5600}
      --workers ${WEB_CONCURRENCY:-1} --threads ${GUNICORN_THREADS:-4}
      --timeout ${GUNICORN_TIMEOUT:-240} app:app'
    autoDeployTrigger: commit
    healthCheckPath: /healthz
    envVars:
      - key: FLASK_SECRET
        generateValue: true
      - key: NS_DB_HOST
        sync: false
      - key: NS_DB_PORT
        sync: false
      - key: NS_DB_USER
        sync: false
      - key: NS_DB_PASSWORD
        sync: false
      - key: NS_DB_NAME
        sync: false
      - key: CLIENTE_DEPLOY_ID
        sync: false
      - key: NS_HOST
        value: 0.0.0.0
      - key: NS_DEBUG
        value: "0"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_THREADS
        value: "4"
      - key: GUNICORN_TIMEOUT
        value: "240"
      - key: AUTOMACAO_APP_DIR
        value: /app/apps/automacao/source
      - key: NANOPONTO_APP_DIR
        value: /app/apps/nanoponto/source
      - key: ZAP_APP_DIR
        value: /app/apps/zap/source
      - key: NANOSTORE_APP_DIR
        value: /app/apps/nanostore/source
      - key: GPSMUSICAL_APP_DIR
        value: /app/apps/gpsmusical/source
      - key: BPA_APP_DIR
        value: /app/apps/bpa/source
      - key: TATOO_APP_DIR
        value: /app/apps/tatoo/source
      - key: RAIOXPACS_APP_DIR
        value: /app/apps/pacs/source
      - key: RAIOXPACS_DATABASE_URL
        sync: false
      - key: RAIOXPACS_PGHOST
        sync: false
      - key: RAIOXPACS_PGPORT
        value: "5433"
      - key: RAIOXPACS_PGUSER
        value: postgres
      - key: RAIOXPACS_PGPASSWORD
        sync: false
      - key: RAIOXPACS_PGDATABASE
        value: raioxpacs
      - key: RAIOXPACS_PGSSLMODE
        value: prefer
      - key: RAIOXPACS_AUTO_BOOTSTRAP_SCHEMA
        value: "1"
      - key: RAIOXPACS_PUBLIC_BASE_URL
        sync: false
      - key: NANOTECH_SHARED_DIR
        value: /app/apps/shared
      - key: RIOB_BASE_URL
        value: http://127.0.0.1:8898
      - key: RIOB_APP_PORT
        value: "8898"
      - key: RIOB_DB_NAME
        value: riobranco
      - key: RB_AGENT_LLM_PROVIDER
        value: "off"
      - key: RIOB_SSL_VERIFY
        value: "0"
