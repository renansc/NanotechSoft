services:
  mysql:
    image: mariadb:10.11.16-jammy
    container_name: nanotechsoft-mysql
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${NS_DB_PASSWORD:-Luis@2024}
      MARIADB_DATABASE: ${NS_DB_NAME:-notechsoft}
    ports:
      - "${NOTECHSOFT_MYSQL_PORT:-3307}:3306"
    volumes:
      - notechsoft_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p\"$${MARIADB_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  pacs-postgres:
    image: postgres:16-alpine
    container_name: nanotechsoft-pacs-postgres
    restart: unless-stopped
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      - -c
      - "log_line_prefix=%m [%p] user=%u db=%d client=%r "
    environment:
      POSTGRES_USER: ${RAIOXPACS_PGUSER:-postgres}
      POSTGRES_PASSWORD: ${RAIOXPACS_PGPASSWORD:-postgres}
      POSTGRES_DB: ${RAIOXPACS_PGDATABASE:-raioxpacs}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - notechsoft_pacs_postgres:/var/lib/postgresql/data
      - ./apps/pacs/source/docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  pacs-postgres-gateway:
    image: haproxy:3.0-alpine
    container_name: nanotechsoft-pacs-postgres-gateway
    restart: unless-stopped
    depends_on:
      pacs-postgres:
        condition: service_healthy
    ports:
      - "${RAIOXPACS_POSTGRES_PORT:-5433}:5433"
    volumes:
      - ./deploy/postgres-gateway/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro

  riob-app:
    container_name: riobranco-app
    image: riob-app:latest
    build:
      context: ./apps/riob/source
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      APP_HTTPS: 0
      FLASK_SECRET: ${RB_FLASK_SECRET:-riob-local-secret}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${RB_DB_NAME:-riobranco}
      DB_USER: ${RB_DB_USER:-riobranco}
      DB_PASSWORD: ${RB_DB_PASSWORD:-riobranco123}
      UI_USER: ${RB_UI_USER:-admin}
      UI_PASS: ${RB_UI_PASS:-admin123}
      ESXI_HOST: ${ESXI_HOST:-192.168.200.198}
      ESXI_USER: ${ESXI_USER:-root}
      ESXI_PASS: ${ESXI_PASS:-}
      ESXI_SSH_PORT: ${ESXI_SSH_PORT:-22}
      RB_FREEPBX_HOST: ${RB_FREEPBX_HOST:-192.168.200.253}
      RB_FREEPBX_SSH_PORT: ${RB_FREEPBX_SSH_PORT:-22}
      RB_FREEPBX_SSH_USER: ${RB_FREEPBX_SSH_USER:-}
      RB_FREEPBX_SSH_PASS: ${RB_FREEPBX_SSH_PASS:-}
      RB_FREEPBX_PJSIP_TRANSPORT: ${RB_FREEPBX_PJSIP_TRANSPORT:-0.0.0.0-wss}
      RB_FREEPBX_PJSIP_ALLOW: ${RB_FREEPBX_PJSIP_ALLOW:-ulaw,alaw}
      RB_ENABLE_HTTPS: ${RB_ENABLE_HTTPS:-1}
      RB_HTTP_PORT: ${RB_HTTP_PORT:-8898}
      RB_HTTPS_PORT: ${RB_HTTPS_PORT:-8899}
      RB_SERVER_NAME: ${RB_SERVER_NAME:-localhost}
      RB_PUBLIC_BASE_URL: ${RB_PUBLIC_BASE_URL:-https://localhost:8899}
      RB_PROJECT_NAME: ${RB_PROJECT_NAME:-RioBranco}
      RB_COMPANY_NAME: ${RB_COMPANY_NAME:-RioBranco}
      RB_COMPANY_CNPJ: ${RB_COMPANY_CNPJ:-20.984.401/0001-30}
      RB_INTERNAL_IP: ${RB_INTERNAL_IP:-192.168.200.10}
      RB_AGENT_LLM_PROVIDER: "off"
      RB_AGENT_WEB_ENABLED: ${RB_AGENT_WEB_ENABLED:-1}
      RB_AGENT_WEB_TIMEOUT: ${RB_AGENT_WEB_TIMEOUT:-12}
      RB_AGENT_WEB_BUDGET: ${RB_AGENT_WEB_BUDGET:-20}
      RB_DATA_DIR: /data/app
      RB_DB_BACKUP_DIR: /backups
      CAMERAS_DATA_DIR: /data/cameras
      RB_AUTOMACAO_MONITOR_CONTAINER_PATH: /opt/automacao-monitor
      RB_IMPORTAR_XML_LEGACY_DIR: /legacy/ImportarXml
      RB_GESTOR_EMAIL_LEGACY_DIR: /legacy/GestorEmails
      RB_MIGRATE_LEGACY_SERVICES: ${RB_MIGRATE_LEGACY_SERVICES:-1}
      RB_SYNC_ABASTECIMENTOS_XML_STARTUP: ${RB_SYNC_ABASTECIMENTOS_XML_STARTUP:-0}
      RB_ENV: ${RB_ENV:-producao}
      APP_ENV: ${RB_ENV:-producao}
      RB_EMAIL_DELETE_FROM_SERVER: ${RB_EMAIL_DELETE_FROM_SERVER:-0}
      RB_EMAIL_AUTO_IMPORT: ${RB_EMAIL_AUTO_IMPORT:-1}
      RB_EMAIL_AUTO_INTERVAL_MINUTES: ${RB_EMAIL_AUTO_INTERVAL_MINUTES:-5}
      RB_EMAIL_TIMEZONE: ${RB_EMAIL_TIMEZONE:-America/Sao_Paulo}
      RB_VENDAS_DIARIO_DIR: /imports/vendas-diario
      RB_VENDAS_DIARIO_TXT_DIR: /imports/vendas-diario/txt
      RB_VENDAS_DIARIO_PDF_DIR: /imports/vendas-diario/pdf
      RB_VENDAS_DIARIO_HORA: ${RB_VENDAS_DIARIO_HORA:-08:00}
      RB_VENDAS_DIARIO_AUTO: ${RB_VENDAS_DIARIO_AUTO:-1}
    volumes:
      - riob_app_data:/data/app
      - riob_cameras_data:/data/cameras
      - ./apps/riob/source/cameras/index.html:/app/cameras/index.html:ro
      - ./apps/riob/source/backupsSql:/backups
      - ./apps/riob/source/Relatorios:/app/Relatorios:ro
      - ./apps/riob/source/esxi:/opt/vsphere-flask-client:ro
      - ./apps/automacao/source:/opt/automacao-monitor:ro
      - ./apps/riob/source/certs:/app/certs:ro
      - ./apps/riob/source/ImportarXml:/legacy/ImportarXml:ro
      - ./apps/riob/source/GestorEmails:/legacy/GestorEmails:ro
      - ${RB_VENDAS_DIARIO_TXT_HOST_DIR:-/media/serverwin/CARGAS/CargasTxt}:/imports/vendas-diario/txt:ro
      - ${RB_VENDAS_DIARIO_PDF_HOST_DIR:-/media/serverwin/CARGAS/VendasDiarioPdfs}:/imports/vendas-diario/pdf:ro

  riob-proxy:
    image: nginx:1.27-alpine
    container_name: riobranco-proxy
    restart: unless-stopped
    depends_on:
      riob-app:
        condition: service_started
    environment:
      RB_ENABLE_HTTPS: ${RB_ENABLE_HTTPS:-1}
      RB_SERVER_NAME: ${RB_SERVER_NAME:-localhost}
      RB_HTTPS_PORT: ${RB_HTTPS_PORT:-8899}
    ports:
      - "0.0.0.0:${RB_HTTP_PORT:-8898}:80"
      - "0.0.0.0:${RB_HTTPS_PORT:-8899}:443"
    volumes:
      - ./apps/riob/source/deploy/nginx/http.conf.template:/etc/nginx/riobranco-http.conf.template:ro
      - ./apps/riob/source/deploy/nginx/https.conf.template:/etc/nginx/riobranco-https.conf.template:ro
      - ./apps/riob/source/deploy/nginx/select-config.sh:/docker-entrypoint.d/40-select-config.sh:ro
      - ./apps/riob/source/certs:/etc/nginx/certs:ro

  app:
    container_name: nanotechsoft-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      pacs-postgres:
        condition: service_healthy
      riob-proxy:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      FLASK_SECRET: ${FLASK_SECRET:-notechsoft-dev-secret}
      NS_DB_HOST: mysql
      NS_DB_PORT: 3306
      NS_DB_USER: ${NS_DB_USER:-root}
      NS_DB_PASSWORD: ${NS_DB_PASSWORD:-Luis@2024}
      NS_DB_NAME: ${NS_DB_NAME:-notechsoft}
      NS_HOST: 0.0.0.0
      NS_PORT: 5600
      NS_DEBUG: ${NS_DEBUG:-0}
      AUTOMACAO_APP_DIR: ${AUTOMACAO_APP_DIR:-/app/apps/automacao/source}
      NANOPONTO_APP_DIR: ${NANOPONTO_APP_DIR:-/app/apps/nanoponto/source}
      ZAP_APP_DIR: ${ZAP_APP_DIR:-/app/apps/zap/source}
      NANOSTORE_APP_DIR: ${NANOSTORE_APP_DIR:-/app/apps/nanostore/source}
      NANOSTORE_SEED_DEMO_DATA: ${NANOSTORE_SEED_DEMO_DATA:-0}
      NANOSTORE_FISCAL_CERT_PATH: ${NANOSTORE_FISCAL_CERT_PATH:-}
      NANOSTORE_FISCAL_CERT_PASSWORD: ${NANOSTORE_FISCAL_CERT_PASSWORD:-}
      NANOSTORE_NFE_SCHEMA_PATH: ${NANOSTORE_NFE_SCHEMA_PATH:-}
      NANOSTORE_NFE_HOMOLOGATION_TRANSMISSION_ENABLED: ${NANOSTORE_NFE_HOMOLOGATION_TRANSMISSION_ENABLED:-0}
      NANOSTORE_ENABLE_HTTPS: ${NANOSTORE_ENABLE_HTTPS:-1}
      NANOSTORE_HTTP_PORT: ${NOTECHSOFT_APP_PORT:-5600}
      NANOSTORE_HTTPS_PORT: ${NOTECHSOFT_HTTPS_PORT:-443}
      NANOSTORE_CERT_APP_HOSTS: ${NANOSTORE_CERT_APP_HOSTS:-192.168.200.254}
      NANOSTORE_PUBLIC_BASE_URL: ${NANOSTORE_PUBLIC_BASE_URL:-https://192.168.200.254/apps/nanostore}
      NANOSTORE_CA_CERT_PATH: ${NANOSTORE_CA_CERT_PATH:-/app/apps/riob/source/certs/riobranco-ca.crt}
      NANOSTORE_HTTPS_CERT_PATH: ${NANOSTORE_HTTPS_CERT_PATH:-/app/apps/riob/source/certs/riobranco-app.crt}
      GPSMUSICAL_APP_DIR: ${GPSMUSICAL_APP_DIR:-/app/apps/gpsmusical/source}
      BPA_APP_DIR: ${BPA_APP_DIR:-/app/apps/bpa/source}
      TATOO_APP_DIR: ${TATOO_APP_DIR:-/app/apps/tatoo/source}
      RAIOXPACS_APP_DIR: ${RAIOXPACS_APP_DIR:-/app/apps/pacs/source}
      RAIOXPACS_PGHOST: ${RAIOXPACS_PGHOST:-pacs-postgres}
      RAIOXPACS_PGPORT: ${RAIOXPACS_PGPORT:-5432}
      RAIOXPACS_PGUSER: ${RAIOXPACS_PGUSER:-postgres}
      RAIOXPACS_PGPASSWORD: ${RAIOXPACS_PGPASSWORD:-postgres}
      RAIOXPACS_PGDATABASE: ${RAIOXPACS_PGDATABASE:-raioxpacs}
      RAIOXPACS_PGSSLMODE: ${RAIOXPACS_PGSSLMODE:-prefer}
      RAIOXPACS_AUTO_BOOTSTRAP_SCHEMA: ${RAIOXPACS_AUTO_BOOTSTRAP_SCHEMA:-1}
      NANOTECH_SHARED_DIR: ${NANOTECH_SHARED_DIR:-/app/apps/shared}
      RIOB_BASE_URL: ${RIOB_BASE_URL:-https://riob-proxy}
      RIOB_SSL_VERIFY: ${RIOB_SSL_VERIFY:-0}
    ports:
      - "${NOTECHSOFT_APP_PORT:-5600}:5600"
    volumes:
      - ./apps:/app/apps
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://127.0.0.1:5600/login >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  portal-proxy:
    image: nginx:1.27-alpine
    container_name: nanotechsoft-portal-proxy
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "0.0.0.0:${NOTECHSOFT_HTTP_PORT:-80}:80"
      - "0.0.0.0:${NOTECHSOFT_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/portal-proxy/https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./apps/riob/source/certs:/etc/nginx/certs:ro

volumes:
  notechsoft_mysql:
  notechsoft_pacs_postgres:
  riob_app_data:
    name: riob_app_data
  riob_cameras_data:
    name: riob_cameras_data
